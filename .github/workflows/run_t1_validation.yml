name: Run T1 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Probe minute coverage
        run: python probe_minutes.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: minute-probe
          path: probe_result.json
